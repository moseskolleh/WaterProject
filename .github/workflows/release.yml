name: Release

# A release is cut by pushing a tag named for the version pyproject.toml
# declares, on a commit already on main:
#
#     git tag v0.3.0 <commit> && git push origin v0.3.0
#
# The job refuses a tag that does not match that version, or a changelog with
# no section for it, so the wheel, the changelog heading and the tag cannot
# name three different releases. Nothing else here is decided by hand: the
# wheel, the sdist and the example packs come from "nox -s release", and the
# web app's release identifier is read out of the committed docs/sw.js.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    permissions:
      # the one job that writes: it creates the GitHub Release and its assets
      contents: write
    env:
      MPLBACKEND: Agg
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the toolkit and the release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extract]"

      # The tag, the package and the changelog have to agree before anything
      # is built. The notes are the changelog's own section for the version.
      - name: The tag names the version pyproject.toml declares
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
          python - "$VERSION" <<'EOF'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M
          )
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section headed '## {version}'")
          open("release-notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          EOF
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A tag on a commit whose generated files are stale would publish a web
      # app that is not the one the sources describe.
      - name: The committed service worker is current
        run: python web/build_offline.py --check

      - name: Build the wheel, the sdist and the example packs
        run: nox -s release

      - name: Record the release
        run: |
          SW_RELEASE=$(sed -n "s/^var VERSION = '\(gwt-v[0-9a-f]*\)';$/\1/p" docs/sw.js)
          if [ -z "$SW_RELEASE" ]; then
            echo "::error::no release identifier found in docs/sw.js"
            exit 1
          fi
          python - "$VERSION" "$TAG" "$GITHUB_SHA" "$SW_RELEASE" <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          version, tag, commit, sw = sys.argv[1:]
          assets = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path("dist").iterdir()) if p.is_file()
          }
          record = {
              "version": version, "tag": tag, "commit": commit,
              "web_app_release": sw, "sha256": assets,
          }
          Path("dist/release.json").write_text(json.dumps(record, indent=2) + "\n")
          with open("release-notes.md", "a", encoding="utf-8") as notes:
              notes.write(
                  "\n---\n\n"
                  f"Web app release identifier: `{sw}` (docs/sw.js at {commit[:12]}).\n\n"
                  "Install this version from the release assets:\n\n"
                  "```bash\n"
                  f"pip install groundwater-toolkit=={version} --find-links "
                  f"https://github.com/${{ github.repository }}/releases/expanded_assets/{tag}\n"
                  "```\n"
              )
          EOF
          cat dist/release.json

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "groundwater-toolkit $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
