name: Release

# A release is cut by pushing a tag named for the version pyproject.toml
# declares, on a commit already on main:
#
#     git tag v0.3.0 <commit> && git push origin v0.3.0
#
# The job refuses a tag that does not match that version, or a changelog with
# no section for it, so the wheel, the changelog heading and the tag cannot
# name three different releases. Nothing else here is decided by hand: the
# wheel, the sdist and the example packs come from "nox -s release", and the
# web app's release identifier is read out of the committed docs/sw.js.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    permissions:
      # the one job that writes: it creates the GitHub Release and its assets
      contents: write
    env:
      MPLBACKEND: Agg
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the toolkit and the release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extract]"

      # The tag, the package and the changelog have to agree before anything
      # is built. CHANGELOG.md is the index: its section for the version lists
      # the entries by their headings, and changelog/<version>.md holds their
      # text. The notes are that list and then a link to the text at the tag,
      # because GitHub refuses a release body over 125,000 characters and one
      # version's text has run to 357,000. The section's own link is left out:
      # it is relative, which resolves in the repository and not from a
      # release page. A tag whose changelog/<version>.md does not exist is
      # refused, so a release cannot be cut with its text still in
      # changelog/unreleased.md, and so is a section that does not begin with
      # the link to that file: a link left behind when the section was renamed
      # would not be recognised as the section's own, and would be published
      # as the first line of the notes. tests/test_changelog.py runs this
      # script, as it is written here, against the committed changelog.
      - name: The tag names the version pyproject.toml declares
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
          python - "$VERSION" "$TAG" "$GITHUB_REPOSITORY" <<'EOF'
          import os, re, sys
          version, tag, repository = sys.argv[1:]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M
          )
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section headed '## {version}'")
          detail = f"changelog/{version}.md"
          if not os.path.isfile(detail):
              sys.exit(
                  f"{detail} does not exist: the entries listed under '## {version}' "
                  "have no text to link to (rename changelog/unreleased.md to it)"
              )
          link, _, listed = match.group(1).strip().partition("\n")
          if link != f"Full text: [{detail}]({detail})":
              sys.exit(
                  f"the section '## {version}' of CHANGELOG.md does not begin with "
                  f"'Full text: [{detail}]({detail})' but with '{link}': its link "
                  "was not renamed with it"
              )
          listed = listed.strip()
          if not listed:
              sys.exit(f"CHANGELOG.md lists no entries under '## {version}'")
          url = f"https://github.com/{repository}/blob/{tag}/{detail}"
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write(f"{listed}\n\nThe full text of each entry: [{detail}]({url})\n")
          EOF
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A tag on a commit whose generated files are stale would publish a web
      # app that is not the one the sources describe.
      - name: The committed service worker is current
        run: python web/build_offline.py --check

      - name: Build the wheel, the sdist and the example packs
        run: nox -s release

      - name: Record the release
        run: |
          SW_RELEASE=$(sed -n "s/^var VERSION = '\(gwt-v[0-9a-f]*\)';$/\1/p" docs/sw.js)
          if [ -z "$SW_RELEASE" ]; then
            echo "::error::no release identifier found in docs/sw.js"
            exit 1
          fi
          python - "$VERSION" "$TAG" "$GITHUB_SHA" "$SW_RELEASE" <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          version, tag, commit, sw = sys.argv[1:]
          assets = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path("dist").iterdir()) if p.is_file()
          }
          record = {
              "version": version, "tag": tag, "commit": commit,
              "web_app_release": sw, "sha256": assets,
          }
          Path("dist/release.json").write_text(json.dumps(record, indent=2) + "\n")
          with open("release-notes.md", "a", encoding="utf-8") as notes:
              notes.write(
                  "\n---\n\n"
                  f"Web app release identifier: `{sw}` (docs/sw.js at {commit[:12]}).\n\n"
                  "Install this version from the release assets:\n\n"
                  "```bash\n"
                  f"pip install groundwater-toolkit=={version} --find-links "
                  f"https://github.com/${{ github.repository }}/releases/expanded_assets/{tag}\n"
                  "```\n"
              )
          EOF
          cat dist/release.json

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "groundwater-toolkit $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
