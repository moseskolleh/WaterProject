name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10/3.11 are the floor; 3.12/3.13 are what the Streamlit Cloud and
        # browser (stlite/Pyodide + numpy 2.x) builds actually ship on.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # headless matplotlib for figure generation in reports/maps
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the toolkit and test/app/extract extras
        run: |
          python -m pip install --upgrade pip
          # streamlit + pdfplumber let the end-to-end AppTest and the
          # scanned-sheet tests run; dev brings pytest. pyarrow is pinned
          # <25 because 25.x can segfault when streamlit serialises tables
          # (see requirements.txt).
          pip install -e ".[dev,app,extract]" "pyarrow<25"

      - name: Run the test suite
        run: python -m pytest -q

  webapp:
    name: Standalone web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the toolkit (for the reference values)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright and its browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: The bundled data must match the source tables
        run: |
          python web/build_webapp_data.py
          git diff --exit-code docs/js/gwt-data.js

      # The browser engine is a port of the Python package, so it is held to
      # the package's own numbers on the real sample workbooks.
      - name: Numerical parity with the Python toolkit
        run: |
          python tests/webapp/make_reference.py
          git diff --exit-code tests/webapp/reference.json
          node tests/webapp/parity.mjs

      - name: Drive the app end to end
        run: node tests/webapp/smoke.mjs
