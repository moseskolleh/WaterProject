name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, on main. The pull request runs keep the slow tests to one Python
  # version; this run takes the whole suite across all four, and it is where
  # longer checks go that a pull request cannot wait for.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# Cancel superseded runs on the same ref. The event is part of the group so
# that a push to main does not cancel the nightly run in progress on main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One version for the npm install, the browser cache key and the browser
  # download, so a bump cannot leave a cached browser the library cannot use.
  PLAYWRIGHT_VERSION: "1.56.1"

# Each step below calls a session from noxfile.py, which is where the commands
# themselves live. "nox -s check" runs the same sessions in the same order on
# one machine, so passing it locally means these jobs pass.
#
# Actions are pinned by commit SHA, with the version they were at as a
# comment: a tag can be moved, a SHA cannot. Dependabot bumps both together.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Ruff is a standalone binary that reads its whole configuration from
      # pyproject.toml, so this job installs neither the toolkit nor its
      # dependencies and stays fast enough to run once rather than across the
      # version matrix. The version is pinned: an unpinned linter turns a new
      # release into a red build on a branch that changed nothing. The pin is
      # read from the dev extra rather than repeated here, because the lint
      # session refuses any other version, and a Dependabot bump of
      # pyproject.toml alone has to lint with the version it proposes.
      - name: Install ruff and nox
        run: |
          RUFF=$(python -c "import tomllib; dev = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev']; print(next(d for d in dev if d.startswith('ruff==')))")
          python -m pip install "$RUFF" nox

      - name: Lint
        run: nox -s lint -- --output-format=github

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10/3.11 are the floor; 3.12/3.13 are what the Streamlit Cloud and
        # browser (stlite/Pyodide + numpy 2.x) builds actually ship on.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the toolkit and test/app/extract extras
        run: |
          python -m pip install --upgrade pip
          # streamlit + pdfplumber let the end-to-end AppTest and the
          # scanned-sheet tests run; dev brings pytest and nox. pyarrow is
          # pinned <25 because 25.x can segfault when streamlit serialises
          # tables (see requirements.txt).
          pip install -e ".[dev,app,extract]" "pyarrow<25"

      # The tests marked slow (the Streamlit AppTests, the example
      # regeneration, and the other tests that took ten seconds or more)
      # exercise Python-version differences no more than the fast ones do, so
      # on a pull request they run once, on 3.12, in the job below. The
      # nightly run takes them on every version.
      # An empty -m selects everything. The condition is written this way
      # round because an expression's && and || fall through on an empty
      # string: "schedule && '' || 'not slow'" is always 'not slow'.
      - name: Run the test suite
        env:
          MARK: ${{ github.event_name != 'schedule' && 'not slow' || '' }}
        run: nox -s tests -- -m "$MARK"

  test-slow:
    name: Tests, slow (Python 3.12)
    # The nightly run already covers these in the matrix above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the toolkit and test/app/extract extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app,extract]" "pyarrow<25"

      # With the fast tests on 3.12 in the matrix, this is the rest of the
      # suite: every test runs on 3.12, in one job or the other, and the two
      # halves run side by side rather than one after the other.
      - name: Run the slow tests
        run: nox -s tests -- -m slow

  webapp:
    name: Standalone web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install the toolkit (for the reference values)
        run: |
          python -m pip install --upgrade pip
          # extract brings pdfplumber: one of the reference values is what the
          # Python PDF reader makes of an unruled field sheet, which the
          # browser reader is then held to on the same bytes.
          pip install -e ".[dev,extract]"

      # Playwright is installed on its own, not from a lockfile, so the npm
      # cache is keyed on its version rather than through setup-node.
      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      # The system libraries Chromium links against are not in the cache, so
      # a cache hit still installs those; it skips only the download.
      - name: Install Playwright and its browser
        run: |
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The chiefdom layer is checked before the bundle is built from it, so a
      # withheld boundary fragment that never made it back into the committed
      # data is reported as itself rather than as a puzzling bundle diff.
      - name: The bundled data must match the source tables
        run: nox -s bundles

      # The browser engine is a port of the Python package, so it is held to
      # the package's own numbers on the real sample workbooks.
      - name: Numerical parity with the Python toolkit
        run: nox -s parity

      - name: Drive the app end to end
        run: nox -s browser

  depth-spine:
    name: Depth Spine workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Python only to run nox; the session itself is npm from start to end.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/depth-spine/package-lock.json

      - name: Install nox
        run: python -m pip install nox

      # Type-check, lint and rebuild both builds, then fail if what was built
      # is not what is committed under src/groundwater/depth_spine/. The
      # build is committed because Streamlit Community Cloud has no npm and a
      # wheel has to carry it; this is what keeps it the build of the source
      # beside it.
      - name: Type-check, lint and rebuild; the build must match
        run: nox -s depth_spine
