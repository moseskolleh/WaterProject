# Weekly, and one pull request per ecosystem for everything minor or patch:
# a dozen single-bump pull requests a week is a queue nobody works through,
# and a major version is a change to read on its own, so it still arrives
# alone. The actions are pinned by commit SHA in the workflows; Dependabot
# moves the SHA and the version comment beside it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # pyproject.toml and the deployment pins in requirements.txt. Ruff is
  # pinned to an exact version on purpose, so its bump comes through here as
  # a pull request whose CI run is the review.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  # The Depth Spine workspace. A bump here can change the committed build under
  # src/groundwater/depth_spine/, and CI fails until that is rebuilt, so
  # these pull requests need "nox -s build" run on them before they merge.
  - package-ecosystem: npm
    directory: /ui/depth-spine
    schedule:
      interval: weekly
    groups:
      depth-spine:
        update-types: [minor, patch]
