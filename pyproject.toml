[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-toolkit"
version = "0.3.0"
description = "Groundwater investigation analysis and reporting toolkit for rural water supply borehole projects in Sierra Leone"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GeomentAqua" }]
dependencies = [
    # numpy is capped <3 to match the deployment pin in requirements.txt
    # (the browser build ships numpy 2.x; a future 3.0 is untested here).
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gis = ["geopandas>=0.14", "pyproj>=3.6"]
# The committed .streamlit/config.toml uses theme keys (baseRadius,
# borderColor, [theme.sidebar]) introduced in Streamlit ~1.57, so pin the
# floor accordingly and mirror the deployment cap in requirements.txt.
app = ["streamlit>=1.57,<2"]
extract = ["pdfplumber>=0.10"]
# 0.78 is the first SDK whose messages.create accepts output_config (the
# JSON-schema structured output) and adaptive thinking, which the extractor
# sends; an older client satisfied ">=0.40" and failed with a TypeError at
# the moment a field officer pressed Extract.
ai = ["anthropic>=0.78"]
# segno and opencv are the two independent oracles the QR encoder is held
# to - one encodes the same standard, the other reads the result back;
# rasterio is the same thing for the GeoTIFF writer, since a raster with the
# wrong georeferencing opens perfectly happily in the wrong place. All three
# are test-only: nothing the toolkit ships imports any of them.
# ruff is pinned to the exact version CI runs, so "it lints here" and "it
# lints in CI" mean the same thing. nox runs the check sequence in
# noxfile.py, and build makes the wheel and sdist its release session ships.
# hypothesis draws the field sheets tests/fuzz puts through both engines, and
# is pinned for the same reason: the cases a pull request draws are fixed by
# the seed and by the version that turns the seed into sheets.
# pyright is pinned like ruff, and for the same reason: a new release finds
# new things. pytest-cov only reports; nothing fails on the number.
dev = [
    "pytest>=7.4", "segno>=1.6", "opencv-python-headless>=4.8", "rasterio>=1.3",
    "ruff==0.16.4", "nox>=2024.4.15", "build>=1.0", "hypothesis==6.168.1",
    "pyright==1.1.414", "pytest-cov>=5",
]

[project.scripts]
# batch use without the apps: recompute saved projects, pool a portfolio,
# write templates, read a scanned sheet
groundwater = "groundwater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundwater = [
    "data/*.csv", "data/*.yaml", "data/*.geojson", "data/*.json",
    "data/text/*.yaml",
    "data/brand/*.png", "data/brand/*.svg",
    "data/brand/fonts/*.woff2", "data/brand/fonts/*.txt",
    "data/brand/fonts/*.json",
]
# The Depth Spine workspace ships inside the wheel. Without these the page is
# dead on every pip install: the component build is absent and the static
# fallback with it. The asset filenames are content-hashed by Vite and change
# on every rebuild, so the assets entry has to be a glob.
"groundwater.depth_spine" = ["static/*.html", "frontend/index.html", "frontend/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A misspelt marker would quietly put a test in the wrong half of the CI
# split, so a marker that is not registered here is an error.
addopts = "--strict-markers"
markers = [
    # Pull request CI runs these on Python 3.12 only, and the nightly run on
    # all four versions. They are every test that drives the app through
    # AppTest, the regeneration of the worked examples, and the tests that
    # took ten seconds or more in a full run: when they were marked, 59 tests
    # of 983, and 540 s of a suite that ran in 930 s on one machine.
    "slow: ten seconds or more; pull request CI runs these on Python 3.12 only",
]

[tool.ruff]
# Ruff's own default excludes cover dist/ but not build/, which here holds a
# whole second copy of the package from the last local build. It is skipped
# today only because it is gitignored, so say so explicitly - otherwise a run
# with --no-respect-gitignore starts linting stale build output and reports
# every finding twice.
extend-exclude = ["build"]

# A backstop against the runaway line, not a house style. The tree already
# keeps 99.4% of its lines under 88 without being told to, so a limit there
# would open with 200-odd findings against code that is not wrong - and a
# lint job that lands red is a lint job someone turns off. At 120 it catches
# only the handful of lines that had genuinely stopped being readable.
line-length = 120

# target-version is deliberately unset: ruff reads requires-python (>=3.10)
# from [project], so the syntax the rules assume cannot drift away from the
# floor the package actually declares.

[tool.ruff.lint]
select = [
    "E4", "E5", "E7", "E9",  # imports, line length, statements, syntax errors
    "F",                     # undefined names, unused imports, dead locals
    "W",                     # trailing whitespace and friends
    "B",                     # bugbear: mutable defaults, silent surprises
    "BLE",                   # blind except - the rule this source already
                             # annotated by hand, now actually enforced
    "RET",                   # assign-then-return
    "RSE",                   # raise with redundant parentheses
    "FLY",                   # static "".join() that wants to be an f-string
    "ISC",                   # implicit string concat: catches a missing comma
    "EXE",                   # shebang and executable-bit mismatches
    "UP",                    # syntax the 3.10 floor allows: X | None, not
                             # Optional[X]; collections.abc, not typing
    "SIM",                   # nested ifs and try/except/pass that say less
                             # than they could
]

# Not selected, deliberately: C4 - 12 hits, nearly all `bbox=dict(...)`
# keyword dicts passed to matplotlib, where dict() is the idiom every example
# uses. UP and SIM were deferred the same way when this job was added and
# then cleared in one mechanical change of their own.

ignore = [
    # An if/else that assigns one name, rewritten as a ternary. Of its eight
    # hits the ones that read better as a ternary were rewritten; the rest are
    # two formulas side by side (the annuity payment), a branch carrying its
    # own comment, a nested ternary, or `a + b if c else d`, whose precedence
    # a reader has to stop and work out. Eight noqa lines would say that less
    # well than this.
    "SIM108",
    # Every hit is a closure defined and called inside one iteration - cell()
    # in the ingestion grid readers, remember() in the QR mask scorer. None is
    # stored, returned or deferred, so there is no late binding to catch.
    # B023 cannot see that, and ten permanent noqa lines on correct code is a
    # worse trade than the rule.
    "B023",
]

[tool.ruff.lint.per-file-ignores]
# The sys.path insert and the stale-module purge have to run before streamlit
# and groundwater are imported: Streamlit Community Cloud pulls new source on
# every push but only reinstalls packages when requirements.txt changes, so
# without it the app file outruns the installed package and the imports break.
# All 9 E402 in this file are that one deliberate decision.
"app/streamlit_app.py" = ["E402"]
# Cell writes are packed onto one line with semicolons so each block reads
# like the region of the spreadsheet it is filling in.
"examples/build_sample_data.py" = ["E702"]

[tool.pyright]
# Basic mode over the package, at the floor requires-python declares. Basic
# is the mode that reads unannotated code as it is: it catches a None used as
# a number, a call with the wrong arguments, an attribute that does not
# exist, without asking for annotations the code does not have.
include = ["src/groundwater"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
# The subpackages re-export their plotting and workbook-writing modules
# through a module __getattr__ (_lazy.py), so that importing one does not
# import matplotlib or openpyxl. Those names are in __all__ and are not
# module globals until read, which is the point, and pyright cannot see
# past the __getattr__.
reportUnsupportedDunderAll = "none"
# The modules that do not pass yet. Every other file in the package is
# checked, a new one included, so this list only ever gets shorter: take a
# module off it in the change that makes it pass. Nearly all of what these
# report is an Optional that the code has already ruled out in a way
# pyright cannot follow (a helper that tests for None, a value read twice),
# or numpy and matplotlib stubs stricter than the calls that work. Excluded
# modules are still read when a checked one imports them; only their own
# findings go unreported. claude.py imports anthropic, which only the ai
# extra installs.
exclude = [
    "src/groundwater/_geometry.py",
    "src/groundwater/costing/export.py",
    "src/groundwater/coverage.py",
    "src/groundwater/depth_spine/view.py",
    "src/groundwater/design/designer.py",
    "src/groundwater/design/drawing.py",
    "src/groundwater/extraction/claude.py",
    "src/groundwater/extraction/pdf_text.py",
    "src/groundwater/extraction/review.py",
    "src/groundwater/geo.py",
    "src/groundwater/hydraulics/analysis.py",
    "src/groundwater/hydraulics/plots.py",
    "src/groundwater/ingestion/checks.py",
    "src/groundwater/ingestion/pumping.py",
    "src/groundwater/ingestion/templates.py",
    "src/groundwater/ingestion/waterquality.py",
    "src/groundwater/mapping/geolibre.py",
    "src/groundwater/mapping/maps.py",
    "src/groundwater/mapping/regional.py",
    "src/groundwater/mapping/subsurface.py",
    "src/groundwater/mapping/terrain.py",
    "src/groundwater/planning.py",
    "src/groundwater/plotting.py",
    "src/groundwater/procurement.py",
    "src/groundwater/qr.py",
    "src/groundwater/quality/assess.py",
    "src/groundwater/quality/diagrams.py",
    "src/groundwater/quality/indices.py",
    "src/groundwater/recompute.py",
    "src/groundwater/registry.py",
    "src/groundwater/reporting/completion.py",
    "src/groundwater/reporting/docx_utils.py",
    "src/groundwater/reporting/handover.py",
    "src/groundwater/reporting/pumping.py",
    "src/groundwater/siting/suitability.py",
    "src/groundwater/text.py",
    "src/groundwater/ves/cache.py",
    "src/groundwater/ves/interpret.py",
    "src/groundwater/ves/inversion.py",
    "src/groundwater/ves/ipi2win.py",
    "src/groundwater/ves/plots.py",
    "src/groundwater/waterpoints.py",
]
