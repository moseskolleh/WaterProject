# What the pumping test results are worth (PLAN.md step 3.2): the spread of
# the adopted transmissivity, the yield and the pump setting as bands, the
# flow regime the Bourdet derivative shows, and the Papadopulos-Cooper fit.
# Both engines write these sentences: hydraulics/spread.py and the "pumping
# spread" section of gwt-core.js. The template rules are in
# src/groundwater/text.py; CONTRIBUTING.md says how to add an entry.

spread_transmissivity: >-
  Resampling the {method} residuals in blocks of {block:g} consecutive readings
  ({replicates:g} resamples of {n:g} readings, a circular block bootstrap) puts
  the transmissivity between {low:num} and {high:num} m2/day (P10 to P90).
  The band is narrower than its percentiles name: on synthetic tests with
  independent 2 cm reading errors a band drawn this way held the true value
  in 64 to 74 tests in a hundred, not 80, and in 48 when consecutive errors
  ran together. Read it as the least the spread can be.
spread_failed: >-
  {failed:g} of the resamples gave no fit and are left out of the band.
spread_withheld: >-
  No band is given for the {method} transmissivity: {reason}.
spread_reasons:
  too_few: it rests on fewer than five readings, too few to resample
  mostly_failed: more than half of the resampled readings gave no fit
spread_yield: >-
  With the static level lowered by the {reserve:g} m dry-season reserve, as
  the recommendation is, that band puts the safe yield between {low:num} and
  {high:num} m3/h.
spread_yield_open: >-
  With the static level lowered by the {reserve:g} m dry-season reserve, as
  the recommendation is, that band puts the safe yield at {low:num} m3/h or
  more; at the top of the band the drawdown no longer limits it.
spread_holds: >-
  At the low end of the band the long-term yield is {long_term:num} m3/h,
  which still covers the recommended {rate:num} m3/h: the safety factor
  absorbs the spread in the data at the dry-season level.
spread_does_not_hold: >-
  At the low end of the band the long-term yield is {long_term:num} m3/h,
  below the recommended {rate:num} m3/h: the safety factor does not absorb the
  spread in the data at the dry-season level, so the rate is not called
  sustainable.
spread_pump: >-
  The pump intake moves between {low:num} and {high:num} m below the top of
  the casing over a dry-season decline of {decline_low:g} to {decline_high:g}
  m. The transmissivity band does not move it: the intake is set by the
  drawdown available, not by the rate.
theis_covariance: >-
  The Theis fit's own covariance puts its transmissivity between {low:num} and
  {high:num} m2/day (nominally P10 to P90; on the same synthetic tests it held
  the true value in 67 tests in a hundred). That band assumes every reading's error is
  independent of the next, which the bootstrap does not.

pc_fit: >-
  The Papadopulos-Cooper solution for a well of large diameter, fitted to all
  {n:g} readings of the first step including those inside casing storage
  (casing radius {rc:.3f} m; Laplace solution inverted by Stehfest's method),
  gives T = {t:num} m2/day with an RMSE of {rmse:num} m. Its storativity is
  not given: in the pumped well it trades off against the well radius, as the
  Theis fit's does, and on a poor fit the readings barely constrain it.
pc_reported: >-
  It is reported beside the other fits and adopted only when none of them
  can be.
pc_adopted: >-
  No other fit can be adopted, so this value is adopted as the best
  available, and the yield that rests on it is indicative.
pc_invalid: >-
  It is not adopted: {why}.
pc_status:
  reported: reported; adopted only where every other fit is disqualified
  adopted: adopted as the best available; every other fit is disqualified

diagnostic_method: >-
  The Bourdet derivative of the first step's drawdown, ds/d ln t with
  neighbours at least {l:g} of a log cycle apart, is read from the slope of
  its log-log curve: a unit slope is casing storage, a plateau radial flow, a
  half slope linear flow along a fracture, and a fall or a rise after the
  plateau a boundary.
diagnostic_shows: >-
  On this test it shows {spans}.
diagnostic_unnamed: >-
  On this test no run of three derivative points holds one slope over enough
  of a log cycle to name a regime.
diagnostic_none: >-
  The first step has fewer than five positive drawdowns, so no derivative is
  drawn.
diagnostic_plateau: >-
  The level of the plateau gives a transmissivity of about {t:num} m2/day, a
  check on the fitted values rather than one adopted.
regime_span: >-
  {what} from {start:g} to {end:g} minutes (slope {slope:.2f})
diagnostic_thresholds: >-
  The derivative's log-log slope names a regime as follows: {unit_min:g} to
  {unit_max:g} casing storage, {half_min:g} to {half_max:g} linear flow, within
  {flat:g} of zero radial flow, and {falling:g} or less a falling derivative;
  a run must hold for three points and {span:g} of a log cycle. These limits
  are judgements, set in the configuration. A derivative is a difference of
  readings and carries their scatter: on synthetic radial-flow tests with 1 to
  2 cm reading errors, a boundary was named in about one test in a hundred,
  and where the derivative was under about 0.1 m some regime other than
  radial flow was named in up to half. A named regime is a reason to look at
  the plot, not a finding on its own.
regimes:
  wellbore_storage: a unit slope, casing storage
  storage_ending: a falling derivative, the end of casing storage
  radial_flow: a plateau, radial flow
  linear_flow: a half slope, linear flow along a fracture
  recharge_boundary: a falling derivative after the plateau, a recharge boundary or leakage
  no_flow_boundary: a rising derivative after the plateau, a no-flow boundary
  closed_boundary: a unit slope after the plateau, a closed boundary

sustainable: >-
  The borehole is successful and sustainable when operated as recommended: at
  the dry-season level, the long-term yield at the low end of the spread in
  the test data still covers the recommended rate.
sustainable_not_held: >-
  The yield is established, but it is not called sustainable: at the
  dry-season level the test does not show the recommended rate holding across
  the spread of its own data (see the pumping test report). Confirm it by
  monitoring the pumping level through a dry season.

# What the pumping test readers and the analysis say about the sheet and the
# fits (ingestion/pumping.py and hydraulics/analysis.py; pumpingFromGrid and
# analysePumpingTest in gwt-core.js).
missing_discharge: >-
  Discharge not recorded for step(s) {steps}. Drawdown and recovery curves are
  produced, but transmissivity and yield results are pending until discharge
  values are supplied.
missing_discharge_some: >-
  Discharge not recorded for step(s) {steps}. Drawdown and recovery curves are
  produced, and each result that needs a missing rate goes without it: the
  drawdown fits take the first step's rate, the recovery and the specific
  capacity the last step's, and the step-test fit leaves out a step with none.
# Why a yield is pending when the sheet gave no pumping readings at all (a
# time column of times of day, or in a unit that cannot be read): it used to
# say the discharge was missing, beside a discharge the sheet records.
no_readings_pending: no pumping readings were read from the sheet
recovery_rate_missing: >-
  The rate pumped when the pump stopped, {step}'s, is not recorded, so the
  recovery is not analysed: Theis recovery reads the residual drawdown against
  that rate, and another step's rate would give it another transmissivity.
time_clock_read: >-
  {count:g} {kind} {count:plural:reading is|readings are} written as a clock
  and read as {format}: {example} is minute {minutes:g} since the pump
  {event}.
time_clock_formats:
  hm: hours and minutes, as Excel reads a time typed into a cell
  ms: minutes and seconds, as the column header says
time_of_day: >-
  The earliest pumping reading is written as {example}, a time of day rather
  than the time since the pump started (a test's first reading is taken
  within its first hour), so no reading on the sheet was used: this toolkit
  does not turn times of day into elapsed time. Write the minutes since the
  pump started, or hours and minutes as 1:30, and for the recovery the
  minutes since it stopped.
step_length_unreadable: >-
  The length of each step is written as '{written}', which this toolkit cannot
  read as a length of time, so it was not used: each step is taken to have run
  as long as its own readings show. Write it in minutes, or with its unit, as
  '60 min' or '1 h'.
diameter_unreadable: >-
  The {what} diameter is written as '{written}', which this toolkit cannot read
  as a diameter (a positive length with its unit), so it was not used and the
  analysis takes the {what} from its settings. Write it with its unit, as
  '5 in' or '125 mm'.
diameters_inconsistent: >-
  The sheet gives a casing of {casing:g} in and a riser of {riser:g} in, and
  a casing no wider than its riser leaves no water standing between them, so
  neither was used and the analysis takes both from its settings.
recovery_on_test_clock: >-
  The recovery times start at {first:g} min, at or after the {duration:g}
  minutes the pump ran, so they are read as counted from the start of the
  test, and {duration:g} min is taken off each to give the time since the pump
  stopped. Head the time column 'Time since pump stopped (min)' if they
  already count from the stop.

# Joining the blocks a constant discharge test, or a recovery, is written in.
block_by_heading: >-
  block {number:g} counts its time within its own hour and its heading
  '{heading}' covers {start:g} to {end:g} min, so {offset:g} min were added to
  it and its first reading, at {first:g} min, is minute {placed:g} of the
  {what}
block_continued: >-
  block {number:g} restarts its time at {first:g} min, inside the {end:g} min
  already read, and its heading names no minutes, so it was read as continuing
  from the last reading before it and {offset:g} min were added to it
block_ambiguous: >-
  Block {number:g} of the {readings} starts at {first:g} min, inside the
  {end:g} min already read, and runs past them to {last:g} min, so the sheet
  does not say whether its times count from the start of the {what} or from
  the start of the block.
block_backwards: >-
  Block {number:g} of the {readings} still starts at {placed:g} min once
  placed, before the {end:g} min already read, so its readings would run
  backwards into the block before it.
block_left_out: >-
  {note} The block was left out of the series rather than joined at a minute
  nobody can check. Head each block with the minutes it covers, as in
  '{example}'.
blocks_joined: >-
  The {readings} are written in {count:g} blocks: {notes}. The blocks have
  been joined into one series running {first:g} to {last:g} min.

# The fits.
cj_unreadable: >-
  Across the fitted window {start:g}-{end:g} min the drawdown rises by less
  than {resolution:g} m, which a dipper cannot tell from a level that holds,
  so Cooper-Jacob does not apply
cj_on_stabilised: >-
  its fitted window {start:g}-{end:g} minutes takes in the level that held from
  {tail:g} minutes, where the drawdown had stopped growing, so its slope is not
  the aquifer's
drawdown_stabilised: >-
  The pumped water level held at about {level:.2f} m {minutes}: its fitted
  line moved by less than {resolution:g} m over those minutes, having risen
  {early:.2f} m a log cycle over the log cycle before. A recharge boundary or
  leakage is indicated, so the Theis/Cooper-Jacob projection to the design
  period is not the governing check; the stabilised level is.
# where it held: on the test's clock, or on the last step's own
stabilised_minutes: from {start:g} to {end:g} minutes
stabilised_minutes_step: from {start:g} to {end:g} minutes into step {step:g}
