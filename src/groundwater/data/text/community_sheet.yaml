# The community handover sheet (PLAN.md step 9.1): one page the community
# keeps, saying how much water the borehole gives, whether it is safe to
# drink, who to call, how to report a fault and what to keep away from it.
#
# It is read by people who did not build the borehole and may read little,
# so every entry is a short plain sentence: no "yield", no "indicative", no
# unit but litres, metres and hours. This file is the English. PLAN.md asks
# for a Krio version translated and checked by native speakers, and forbids
# a machine translation, so none is here; the words below are what such a
# translation would be made of.

# What the sheet is, on the card of the Handover page that builds it, in
# both apps.
about: >-
  One page for the community to keep, in plain English: how much water the
  borehole gives, whether it is safe to drink, who to call, how to report a
  fault and what to keep away from it. It says a little less than the
  pumping test allows, never more, and says so where something is not known.

title: Your borehole at {place}
title_unnamed: Your borehole
# across the top of a sheet built with one of the bundled examples loaded,
# so that a copy made while trying the toolkit is never taken for a real one
example: >-
  This sheet was made from example data. It is not about a real borehole and
  must not be handed out.

# --- how much water -----------------------------------------------------
# The amount is the lower end of the safe yield, rounded down, as jerrycans
# of 20 litres: a figure a community plans by is better a little low.
water_heading: How much water
water_day: >-
  About {cans:num} {cans:plural:jerrycan|jerrycans} of water a day.
water_day_detail: >-
  That is {litres:num} litres, with the pump used for {hours:g} {unit} a
  day. A jerrycan holds {can:g} litres.
water_hour: >-
  About {cans:num} {cans:plural:jerrycan|jerrycans} of water in an hour.
water_hour_detail: >-
  That is {litres:num} litres in an hour. A jerrycan holds {can:g} litres.
# less than one jerrycan in an hour is given in litres
water_litres_hour: About {litres:num} litres of water in an hour.
water_litres_day: >-
  About {litres:num} litres of water a day, with the pump used for {hours:g}
  {unit} a day.
# the hours may be six and a half, which no plural rule counts
hour_words:
  one: hour
  other: hours
water_very_little: The pumping test found very little water in this borehole.
water_tested: This comes from the pumping test done on the borehole.
# An "indicative" yield, in the words of somebody who was not at the test.
# No cause is given: a yield is indicative for a short test, for one inside
# its casing-storage time, for readings that contradict the sheet's header,
# and the sheet cannot say which without saying it wrongly of the others.
water_first_estimate: >-
  This is a first estimate. The borehole may give less than this, most of
  all in the dry season.
water_shortage: >-
  If the pump gives much less than this, or runs dry, tell the committee.
water_none: How much water this borehole gives has not been measured yet.

# --- is it safe to drink ------------------------------------------------
# One answer for each verdict of the water quality assessment, and one for
# no assessment. The verdict is the engine's, which fails closed: anything
# short of a pass is not told as safe.
quality_heading: Is the water safe to drink?
quality:
  pass: Yes. The water was tested and is safe to drink.
  aesthetic: >-
    Yes. The water was tested and is safe to drink. It may have a taste, a
    smell or a colour.
  # the engine's own verdict in plain words: treatment or another source.
  # What was found may be something boiling or chlorine does not take out,
  # so the sheet does not say that treating the water makes it safe
  health_fail: >-
    No, not as it is. This water must be treated before you drink it, or
    drinking water taken from another source.
  national_fail: >-
    Not yet. The water does not meet the national standard. Treat it before
    you drink it.
  indeterminate: >-
    Not known yet. The tests are not complete. Treat this water before you
    drink it until the committee says it is safe.
  none: >-
    Not known yet. The water has not been tested. Treat it before you drink it
    until it has been.
quality_found: "The test found too much of this in the water: {names}."
quality_ask: Ask the committee how the water is to be treated.

# --- who to call --------------------------------------------------------
contacts_heading: Who to call
contacts_columns:
  role: Who
  name: Name
  phone: Phone
# lines left to be written in by hand, after the committee's
contacts_write_in:
  mechanic: Pump mechanic
  office: The district water office

# --- how to report a fault ----------------------------------------------
report_heading: If the pump breaks or the water changes
report_tell: Tell the caretaker or a committee member the same day.
report_number: >-
  Give them the number of this borehole: {id}. It is also on the plate fixed
  to the borehole.
report_scan: Or scan the square below with a phone to send a report.
report_caption: Scan to report a fault at borehole {id}

# --- what to keep away --------------------------------------------------
# The rows of data/site_separation_distances.csv a community can act on, in
# its own words. A row of the table that is not named here is not on the
# sheet: a stream or the coast is not something a village moves.
keep_heading: Keep these away from the borehole
keep_structures:
  Septic tank or soakaway: Latrines, septic tanks and soakaways
  Buildings: Houses and other buildings
  Hand dug well: Hand dug wells
  Solid waste dump or burial ground: Rubbish dumps and burial grounds
keep_line: "{what}: at least {distance:g} metres away."
keep_centre: Borehole
keep_metres: "{distance:g} m"
keep_caption: >-
  Each must be at least this far from the borehole. The picture is not to
  scale.

# said to the builder when more committee members were entered than the
# one page holds
too_many_contacts: >-
  The sheet prints the first {shown:g} committee members so that it stays one
  page; {left:g} more {left:plural:was|were} entered and {left:plural:is|are}
  left off.

# --- for whoever builds the sheet, shown beside the button and never
# printed on it: what the sheet could not say, and why ------------------
builder_notes:
  no_hours: >-
    Enter the hours the pump is used each day to print a daily amount.
    Without it the sheet gives the amount in an hour.
  no_test: >-
    No pumping test is loaded, so the sheet says the amount of water has not
    been measured.
  pending: >-
    The pumping test gives no yield yet, so the sheet says the amount of
    water has not been measured. The Pumping test page says why.
  first_estimate: >-
    The yield is indicative, so the sheet calls the amount a first estimate.
  no_quality: >-
    No water quality result is loaded, so the sheet says the water has not
    been tested.
  no_identifier: >-
    No borehole identifier is given, so the sheet names no plate. Type the
    identifier the Asset registry gave the borehole.
  bad_identifier: >-
    The identifier entered is not one the Asset registry gives (check its
    last character), so the sheet prints no number and no square to scan.
  no_address: >-
    No report address is set, so the sheet carries no square to scan.
  no_committee: >-
    No committee member is entered, so the sheet leaves lines to write on.
  example: >-
    A bundled example is loaded, so the sheet says across its top that it is
    not about a real borehole.
  english_only: >-
    The sheet is in English. A Krio version waits for a translation checked
    by native speakers; none is machine made.
