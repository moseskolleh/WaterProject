# The water quality report's recommendations, in the order the report gives
# them. Both engines read this file: reporting/quality.py
# quality_recommendations and gwt-docx.js qualityRecommendations. The
# template rules are in src/groundwater/text.py; CONTRIBUTING.md says how to
# add an entry.

treat_health: >-
  Treat or replace the source before it is used for drinking: health based
  limits are exceeded for {parameters}.

treat_national: >-
  Treat before the supply is accepted against the national standard: national
  limits are exceeded for {parameters}.

# Advice for a parameter over its limit, keyed by the standards-table name
# (normalise_parameter). It used to be matched by substring on the name as
# written, so "Sulphate" got the pH advice for containing "ph".
treatment_advice:
  iron: >-
    Iron above the acceptability value causes staining and metallic taste;
    aeration followed by sand filtration or a simple oxidation filter normally
    resolves it.
  manganese: >-
    Manganese requires oxidation and filtration (aeration or chlorination
    followed by filtration); monitor infant exposure in the meantime.
  e. coli: >-
    Any E. coli detection calls for shock chlorination of the borehole,
    verification of the sanitary seal and apron, and re-sampling before use.
  total coliforms: >-
    Coliform detection calls for disinfection of the borehole and pump, a
    sanitary inspection of the wellhead, and re-sampling.
  nitrate (as no3): &nitrate >-
    Elevated nitrate usually indicates pollution from sanitation or
    agriculture; investigate the sanitary protection zone. Do not give the
    water to bottle fed infants until resolved.
  nitrate (as n): *nitrate
  nitrate + nitrite: *nitrate
  fluoride: >-
    Fluoride above 1.5 mg/L requires an alternative source or defluoridation
    (bone char or activated alumina).
  arsenic: >-
    Arsenic above 0.01 mg/L requires an alternative source or specialised
    removal; re-test to confirm before any use for drinking.
  turbidity: >-
    High turbidity interferes with disinfection; extend development of the
    borehole and re-sample.

# pH is out of range in one of two directions, and the advice differs: the
# low-pH advice used to be given for a pH of 9.2.
ph_low: >-
  Low pH water is corrosive to metal fittings; a limestone contactor or careful
  choice of corrosion resistant materials is advised.

ph_high: >-
  A pH above the acceptability range reduces the effectiveness of chlorine
  disinfection and can give the water a bitter taste and deposit scale; confirm
  the reading and set any chlorine dose to suit.

# For a faecal pathogen found in the water, which has no table entry to key
# advice by and used to get none under "Treat before use".
pathogen: >-
  A faecal pathogen in the water calls for shock chlorination of the borehole,
  a sanitary inspection to find where the contamination enters, and re-sampling
  for the pathogen and for E. coli before the supply is used for drinking.

acceptability: >-
  Acceptability limits are exceeded for {parameters}: simple treatment is
  advisable if users complain of taste, odour or staining.

# "No treatment is required" is a clearance, and a report whose verdict is
# indeterminate has not established one: it says what is outstanding instead.
# {outstanding} is the assessment's open questions, joined with "; " and
# capitalised.
not_cleared: >-
  Do not treat this supply as safe to drink on these results. {outstanding}.
  Resolve these and re-issue the assessment before any treatment decision is
  taken.

no_treatment: >-
  No treatment is required on the basis of the parameters tested. Maintain the
  sanitary seal and apron in good condition.

after_maintenance: >-
  Disinfect the borehole after any maintenance and re-test microbiological
  quality before the source is returned to use.

repeat_testing: >-
  Repeat physico-chemical and bacteriological testing at least once a year,
  and after any flooding, repair work on the wellhead or change in taste,
  colour or odour.

# The assessment's own words (quality/assess.py, corrosivity.py and their
# ports in gwt-core.js) where they are new; the older remarks are still
# worded once in each engine.

# A value whose unit states a chemical basis its guideline is not written
# on, put on that basis by a ratio of molar masses (standards.py
# _BASIS_FACTORS): calcium as CaCO3, nitrate as N.
unit_basis_converted: >-
  '{parameter}' is reported in '{unit}' and was put on the basis its guideline
  is written on, {guideline} as {basis}, by a factor of {factor:.4f}, the ratio
  of their molar masses.

# A nitrate or nitrite row reported as nitrogen is graded against the
# guideline for nitrogen; the remark says so and gives the ion's figure.
as_nitrogen: >-
  reported as nitrogen: {value:g} {unit} as N is {ion_value:num} {unit} as {ion}

# A determinand with no guideline value whose unit cannot be put on the
# table's scale: it decides nothing, so it no longer holds up the verdict,
# and the indices leave it out. {why} is the reason a graded row would give.
no_guideline_unit: >-
  {note}; it is reported in '{unit}': {why}, so the value is left out of the
  indices computed from the sample

value_not_used: >-
  '{parameter}' has no guideline value and does not decide the verdict, but it
  is reported in '{unit}': {why}, so the value is left out of the indices
  computed from the sample.

# A count seen and not numbered ("Present", "TNTC") in a unit that cannot be
# put on the guideline's scale. Zero is zero on every count scale, so it is
# graded as a count above zero rather than refused.
zero_any_unit: >-
  in '{unit}': {why}; a count above zero is above zero whatever the unit

# The corrosivity indices' temperature, when none can be used.
temperature_not_reported: Temperature assumed 25 C (not reported).

temperature_unreadable: >-
  Temperature assumed 25 C (the temperature is reported in a unit that could
  not be read).
