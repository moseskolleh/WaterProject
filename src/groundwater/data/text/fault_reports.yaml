# Reports on a borehole from its plate and by SMS (PLAN.md step 7.1): what
# both engines say about a report they take, hold or refuse, the plate's
# words about its symbol, and what both apps say about the report page.
# Both engines read this file: groundwater/fault_reports.py (with
# groundwater/registry.py and groundwater/reporting/registry.py) and the
# fault reports section of gwt-core.js (with gwt-docx.js). The template
# rules are in src/groundwater/text.py; CONTRIBUTING.md says how to add an
# entry.

# The four things a report can say, as the report page offers them, keyed
# by the choice a report records.
choices:
  working: Working
  broken: Broken
  slow: Slow
  taste: Bad taste or colour

# The words an SMS report may use after the identifier, read in capitals,
# and the choice each one is. COLOR is the spelling a phone's English
# keyboard may put in for COLOUR. A word in another language is added here
# by somebody who speaks it (step 9.2), not guessed.
sms_words:
  WORKING: working
  BROKEN: broken
  SLOW: slow
  TASTE: taste
  COLOUR: taste
  COLOR: taste
  BAD: taste

# Who an SMS report is recorded as being by: the sender as the gateway or
# the file gives it, or the channel alone where neither does.
sms_by: "SMS from {sender}"
sms_by_unknown: SMS

# Why a report is not taken. {words} is the list of sms_words, "WORKING,
# BROKEN, ... or BAD".
no_bh: >-
  Not a report: a report begins BH, then the borehole's identifier from its
  plate, then one word ({words}).
no_identifier: >-
  There is no identifier after BH: a report is BH, then the identifier from
  the plate, then one word ({words}).
no_word: >-
  There is no word after the identifier: a report ends with one word
  ({words}), and anything after it is kept as a note.
unknown_word: >-
  {word} is not one of the report's words ({words}), so what the report says
  about the borehole cannot be told.
no_choice: >-
  Choose what the report says: working, broken, slow, or bad taste or
  colour.
no_date: >-
  The message carries no day it was received, and no day was given for
  messages that carry none: give one, written as 2026-05-01, or write it
  before BH on the message's line.
bad_date: >-
  The day received, {date}, cannot be read: a day is read only written
  year, month and day, as 2026-05-01, because one written 01/05/2026 could
  be the first of May or the fifth of January.
two_dates: >-
  The line carries two days, {first} and {second}, so the day it was
  received cannot be told.
bad_day: >-
  The day of the report, {when}, is not a day written year, month and day,
  as 2026-05-01.
no_day: >-
  The report has no day: write the day it is about, year, month and day, as
  2026-05-01.
held: >-
  {note} A report by SMS has nobody reading that as it is typed, so it is
  held until a person who has compared the identifier with the plate, or
  asked the sender, confirms it.

# An import, in both apps: how many messages, lines or reports were read
# and what became of them.
import_summary: >-
  {n:g} read: {accepted:g} accepted, {held:g} held for a person to confirm,
  {refused:g} refused.

# A file of reports, as the browser app exports the reports queued on a
# phone, that cannot be read.
file_refused: >-
  That is not a file of borehole reports this release of the toolkit can
  read.

# The table of an import, in both apps.
columns:
  line: Line
  received: Received
  sender: Sender
  borehole: Borehole
  says: Says
  outcome: Outcome
  why: Why
outcome:
  accepted: Accepted
  held: Held for a person to confirm
  refused: Refused

# The report address of service.report_url, refused. {url} is as typed.
url_refused: >-
  The report address {url} cannot go on a plate: it should be the browser
  app's address as the programme serves it, beginning https://, written in
  plain ASCII letters, digits and punctuation (an international domain in
  its xn-- form), with no blank and no # part. A browser keeps the app for
  use with no network only from an https address.

# The plate (the identification placard): the caption under its symbol,
# with no report address set and with one, and the line under its details.
placard_caption_text: >-
  Scan for this borehole's identifier and position. The symbol carries the
  details themselves, so it reads with no network and no application
  installed.
placard_caption_link: >-
  Scan to report on this borehole: the symbol is a link to the toolkit's
  report page for it, which opens with no network on a phone that has
  opened the toolkit before, and the identifier above is in the link.
placard_quote: >-
  Report a breakdown or a change to this borehole against the identifier
  above. Quote it in full, including the last character: it is a check
  character, and it is what stops a repair being recorded against a
  different village's borehole.

# Both apps' Asset registry pages: the heading of the reports, and the
# report page is in one of them.
heading: Reports from plates and by SMS
browser_only: >-
  The report page a plate's symbol opens is in the browser app only. Both
  apps take reports by SMS, and the file of reports a phone exports, on
  their Asset registry pages.

# Both apps' import of reports: what a report by SMS and a file of them
# look like ({words} as in no_bh), the day for messages that carry none, and
# a held report released by a person.
sms_format: >-
  A report by SMS reads BH, the identifier from the plate, one word
  ({words}) and any note. A file of messages has one a line, with the day
  and time received and the sender before BH where the copy has them; a
  file of reports is what the browser app exports from a phone. No SMS
  gateway is needed: a programme that runs one passes what it receives to
  the same reader.
received_on_help: >-
  The day received, written as 2026-05-01, for messages that carry none.
  Left blank, a message with no day is refused rather than dated today.
confirm: Confirmed against the plate

# Both apps' report address, beside the plate.
address_help: >-
  The browser app's address, https, as the programme serves it. With one,
  the plate's symbol is a link to the report page for this borehole, which
  works with no network on a phone that has opened the app before. Blank,
  the symbol carries the details themselves as plain text, which read with
  no network.
