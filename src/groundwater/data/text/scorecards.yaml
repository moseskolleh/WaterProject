# Contractor scorecards (PLAN.md step 6.3): each drilling contractor's
# boreholes across the project files pooled on the Portfolio page, from the
# supervision, procurement and drilling records the files carry. Written by
# scorecards.py and by the scorecard functions of gwt-core.js, and read by
# both apps' Portfolio and Procurement pages. Every entry is read by its
# quoted id in both engines, never by an id built from pieces. Metres are
# drilled metres; {value} is a sum of money and {over} a difference in
# metres, each already written out with its sign. The template rules are in
# src/groundwater/text.py; CONTRIBUTING.md says how to add an entry.

title: Contractor scorecards
subtitle: Each drilling contractor's boreholes, from the supervision, procurement and drilling records

# The cover's details.
row_projects: Project files pooled
row_boreholes: Boreholes drilled
row_contractors: Contractors named
row_issued: Issued

# The summary.
summary_none: >-
  None of the project files given holds a drilled borehole, so there is no
  scorecard yet.
summary_counts: >-
  {boreholes:g} {boreholes:plural:borehole|boreholes} drilled by
  {contractors:g} {contractors:plural:contractor|contractors}, from
  {projects:g} project {projects:plural:file|files}.
summary_counts_unnamed: >-
  {boreholes:g} {boreholes:plural:borehole|boreholes} drilled, from
  {projects:g} project {projects:plural:file|files}.
summary_unnamed: >-
  {n:g} {n:plural:borehole names|boreholes name} no contractor in the site
  details or on the drilling log, so {n:plural:it is|they are} set out apart
  and not ranked.
summary_ledger_only: >-
  {n:g} {n:plural:borehole comes|boreholes come} from {n:plural:a project
  file|project files} saved before the scorecards, which {n:plural:carries|carry}
  only {n:plural:its|their} ledger of predictions and outcomes: for
  {n:plural:it|them} the scorecards hold only the outcome and the forecast.
summary_ranked: >-
  {ranked:g} {ranked:plural:contractor is|contractors are} ranked by dry
  holes against the forecast: the dry holes found on the boreholes forecast
  before drilling, less the number the forecasts expected, for each such
  borehole. Fewer than expected ranks first. A contractor is ranked only on
  at least {minimum:g} forecast boreholes whose outcome is known.
summary_unranked: >-
  No contractor has {minimum:g} boreholes forecast before drilling whose
  outcome is known, so none is ranked: a contractor is ranked by its dry
  holes against the forecast, and only on at least that many.
summary_n: >-
  Every figure says how many boreholes it rests on, and a measure that none
  of a contractor's project files records reads "not recorded", never nought.

