      Procurement and Contract Management of Drilled Well Construction.
    url: https://rural-water-supply.net/
    version: unrecorded
    retrieved: unrecorded
    licence: unverified
    licence_evidence: >-
      No redistribution grant has been established for the guides these
      tables were built from, and none is claimed for the tables. The figures
      are short factual line items, not the guides' prose, but nobody has
      checked whether that distinction holds here.
    attribution: >-
      Rural Water Supply Network practice guides; see Reference documents.
    share_alike: false
    changes_made: >-
      The worked examples were reduced to a unit-rate table with a quantity
      basis this toolkit can compute against, and the supervision text to
      one checklist row per item with a critical flag. Unit costs are the
      guides' example figures, not a market survey of Sierra Leone, and a
