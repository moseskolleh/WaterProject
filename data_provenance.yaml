# Where every bundled dataset came from, and under what terms.
#
# The prose version is THIRD_PARTY_NOTICES.md; this is the same information in
# a form a check can read. The sha256 of each committed file is recorded so a
# silent substitution - a dataset quietly replaced with a different vintage,
# or an edit that never made it back to the build script - shows up as a
# mismatch rather than as numbers that changed for no reason.
#
# `licence_evidence` is the point of this file. It says where the licence
# claim comes from, and `unverified` means exactly that: nobody has checked,
# and it must not be read as permission.
#
# Regenerate the checksums with:
#     python -c "import hashlib,pathlib,sys; \
#       [print(f, hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()) \
#        for f in sys.argv[1:]]" <paths>

