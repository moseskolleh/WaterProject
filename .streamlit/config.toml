[theme]
base = "dark"
primaryColor = "#7CFC00"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#ffffff"
linkColor = "#9FFF4D"
borderColor = "#253A10"
baseRadius = "12px"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"

[browser]
gatherUsageStats = false

[global]
# app/state.py keeps a widget's value while its page is off screen by writing
# the value back to itself on every run, Streamlit's documented way of doing
# it. Streamlit logs a warning, with a stack trace, the first time a widget
# with a default is drawn from such a value; here that is by design.
disableWidgetStateDuplicationWarning = true
